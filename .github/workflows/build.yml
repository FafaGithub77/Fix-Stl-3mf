name: Build and Release Mac App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Fix Stl.app
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # L'app Platypus e' solo un involucro: nel build non servono Python ne' pip.
      # Le dipendenze (requirements.txt) servono a chi USA l'app.
      - name: Install Platypus command line tool
        run: |
          curl -L -O https://github.com/sveinbjornt/Platypus/releases/download/v5.5.0/platypus5.5.0.zip
          unzip -q platypus5.5.0.zip
          cd Platypus.app/Contents/Resources
          sudo bash InstallCommandLineTool.sh

      - name: Build macOS App with Platypus
        run: |
          chmod +x fix_stl.sh
          platypus \
            --overwrite \
            --name "Fix Stl" \
            --interface-type "Droplet" \
            --interpreter /bin/sh \
            --droppable \
            --suffixes "stl|3mf" \
            --bundled-file "fix_stl.py" \
            fix_stl.sh \
            "Fix Stl.app"

      - name: Compress App
        run: ditto -c -k --keepParent "Fix Stl.app" Fix-Stl-macOS.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fix-Stl-macOS
          path: Fix-Stl-macOS.zip

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Fix-Stl-macOS.zip
