name: Build and Release Mac App

on:
  push:
    tags:
      - 'v*'  # Si attiva automaticamente quando crei un tag (es. v1.0.1)
  workflow_dispatch:

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install trimesh pymeshfix pyvista numpy-stl scipy

      - name: Install Platypus CLI
        run: |
          brew install platypus

      - name: Build macOS App with Platypus
        run: |
          platypus \
            --app-name "Fix Stl" \
            --interface-type Droplet \
            --interpreter "/bin/sh" \
            --bundled-file fix_stl.py \
            --file-extension stl \
            --file-extension 3mf \
            fix_stl.sh \
            "Fix Stl.app"

      - name: Compress App
        run: |
          zip -r fix_stl_macos.zip "Fix Stl.app"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fix_stl_macos.zip
          path: fix_stl_macos.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: fix_stl_macos.zip

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: fix_stl_macos.zip
          generate_release_notes: true