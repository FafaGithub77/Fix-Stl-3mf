name: Build and Release Mac App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Fix Stl.app
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # L'app Platypus e' solo un involucro: nel build non servono Python ne' pip.
      # Le dipendenze (requirements.txt) servono a chi USA l'app.
      - name: Install Platypus command line tool
        run: |
          curl -L -O https://github.com/sveinbjornt/Platypus/releases/download/v5.5.0/platypus5.5.0.zip
          unzip -q platypus5.5.0.zip
          cd Platypus.app/Contents/Resources
          sudo bash InstallCommandLineTool.sh

      # Icona: metti nel repo icon.icns oppure icon.png (meglio 1024x1024, quadrata).
      # Se c'e' solo il PNG, qui viene convertito in .icns.
      - name: Prepare app icon
        run: |
          if [ -f icon.icns ]; then
            cp icon.icns AppIcon.icns
          elif [ -f icon.png ]; then
            mkdir AppIcon.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s icon.png --out "AppIcon.iconset/icon_${s}x${s}.png"
              sips -z $((s*2)) $((s*2)) icon.png --out "AppIcon.iconset/icon_${s}x${s}@2x.png"
            done
            iconutil -c icns AppIcon.iconset -o AppIcon.icns
          else
            echo "::warning::Nessuna icona trovata (icon.icns o icon.png): l'app avra' l'icona di default"
          fi

      - name: Build macOS App with Platypus
        run: |
          chmod +x fix_stl.sh
          ICON_ARGS=""
          if [ -f AppIcon.icns ]; then ICON_ARGS="--app-icon AppIcon.icns"; fi
          platypus \
            --overwrite \
            --name "Fix Stl" \
            --interface-type "Droplet" \
            --interpreter /bin/sh \
            --droppable \
            --suffixes "stl|3mf" \
            --bundled-file "fix_stl.py" \
            $ICON_ARGS \
            fix_stl.sh \
            "Fix Stl.app"

      - name: Compress App
        run: ditto -c -k --keepParent "Fix Stl.app" Fix_Stl-3mf_macos.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fix-Stl-macOS
          path: Fix_Stl-3mf_macos.zip

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Fix_Stl-3mf_macos.zip
